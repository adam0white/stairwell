# Match the shared lab runtime; never download a runtime per repository.
engineStrict: true
strictPeerDependencies: true
hoist: false
resolutionMode: highest
verifyDepsBeforeRun: error
dedupePeerDependents: true
minimumReleaseAge: 1440
# Owned releases can be consumed on publication day.
minimumReleaseAgeExclude:
  - "@adam0white/*"
packageImportMethod: hardlink
allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261019.1: true
  fsevents: false
overrides:
  sharp: 0.35.5
  miniflare>undici: 7.30.1
# The retained garden replay artifact works with this exact released client;
# native/file replay controls verify it. Keep every other peer check strict.
peerDependencyRules:
  allowedVersions:
    "@adam0white/hearsay-garden-replay@0.0.0-task2>@adam0white/lab-client": "0.4.15"
