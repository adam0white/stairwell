packages:
  - historical/*
# Match the shared lab runtime; never download a runtime per repository.
engineStrict: true
strictPeerDependencies: true
hoist: false
resolutionMode: highest
verifyDepsBeforeRun: error
dedupePeerDependents: true
minimumReleaseAge: 1440
# Owned releases can be consumed on publication day.
minimumReleaseAgeExclude:
  - "@adam0white/*"
packageImportMethod: hardlink
allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261019.1: true
  fsevents: false
overrides:
  sharp: 0.35.5
  miniflare>undici: 7.30.1
  # The modern SDK must validate the same retained schema as the game.
  # Leave the historical SDKs and explicit HF3 alias unchanged.
  "@adam0white/lab-client@0.5.2>@adam0white/human-framework": 4.6.0
